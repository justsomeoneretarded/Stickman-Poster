name: Generator development checks

on:
  push:
    paths: ['studio/**', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libcairo2
          python -m pip install -r requirements-layered.lock
          python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fixed development fixture, not channel production
        run: |
          python -m studio.cli render examples/gravity.json --out output/ci --width 640 --fps 12 --max-seconds 10 --silent-preview
          ffmpeg -v error -i output/ci/final.mp4 -f null -
      - name: Upload only public synthetic development outputs
        uses: actions/upload-artifact@v4
        with:
          name: silent-render-development-benchmark
          retention-days: 3
          path: |
            output/ci/final.mp4
            output/ci/contact-sheet.jpg
            output/ci/report.json
            output/ci/captions.srt
            output/ci/posting.json
          if-no-files-found: error

      - name: Render expressive visual studies in both aspect ratios
        run: |
          python ci/style_preview.py
          ffmpeg -v error -i output/style-study/landscape/final.mp4 -f null -
          ffmpeg -v error -i output/style-study/portrait/final.mp4 -f null -
      - name: Upload expressive motion studies for review
        uses: actions/upload-artifact@v4
        with:
          name: expressive-style-study-both-formats
          retention-days: 7
          path: |
            output/style-study/landscape/final.mp4
            output/style-study/landscape/contact-sheet.jpg
            output/style-study/landscape/report.json
            output/style-study/portrait/final.mp4
            output/style-study/portrait/contact-sheet.jpg
            output/style-study/portrait/report.json
          if-no-files-found: error
      - name: Upload locally generated voiced dual-format qualification
        if: hashFiles('previews/comedy-two-format-qualification/long-form/final.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: local-voiced-comedy-two-format-qualification
          retention-days: 7
          path: previews/comedy-two-format-qualification/
          if-no-files-found: error

      - name: Upload locally generated Turbo voice qualification
        if: hashFiles('previews/turbo-voice-qualification/qualification.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: turbo-three-voice-qualification
          retention-days: 7
          path: previews/turbo-voice-qualification/
          if-no-files-found: error

      - name: Upload layered opening studies
        if: hashFiles('previews/layered-opening/landscape/opening.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: layered-2d-opening-both-formats
          retention-days: 14
          path: previews/layered-opening/
          if-no-files-found: error
