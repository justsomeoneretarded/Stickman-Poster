name: Generate voiced episode
run-name: "${{ inputs.title }} — long + vertical short"
on:
  workflow_dispatch:
    inputs:
      title:
        description: Idea / title (example — What if you could bench a car?)
        required: true
        type: string
      description:
        description: Describe the idea, events, tone, and ending you want (humor only if requested)
        required: true
        type: string
      minutes:
        description: Long video target minutes (guidance only; longer stories are allowed)
        required: true
        default: '3'
        type: string
      short_seconds:
        description: Vertical short target seconds (standalone best-gags edit, guidance only)
        required: true
        default: '60'
        type: string
      voices:
        description: Number of speakers and voices (single narrator, pair, or all three)
        required: true
        default: 3 speakers — Maya + Leo + Max
        type: choice
        options:
          - 1 speaker — Maya (female)
          - 1 speaker — Leo (Kit Laser)
          - 1 speaker — Max (Warguy)
          - 2 speakers — Maya + Leo
          - 2 speakers — Maya + Max
          - 2 speakers — Leo + Max
          - 3 speakers — Maya + Leo + Max
      screen_text:
        description: On-screen text (no character-name labels)
        type: choice
        default: Essential labels only
        options: [Essential labels only, Captions, No overlays]
      width:
        description: Video width
        type: choice
        default: '1920'
        options: ['960', '1280', '1920']
permissions:
  contents: read
concurrency:
  group: voiced-episode-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      EPISODE_TITLE: ${{ inputs.title }}
      EPISODE_DESCRIPTION: ${{ inputs.description }}
      EPISODE_MINUTES: ${{ inputs.minutes }}
      EPISODE_VOICES: ${{ inputs.voices }}
      EPISODE_SCREEN_TEXT: ${{ inputs.screen_text }}
      EPISODE_WIDTH: ${{ inputs.width }}
      EPISODE_SHORT_SECONDS: ${{ inputs.short_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install uv==0.12.23
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python --index-strategy unsafe-best-match -r requirements-voice-cpu.lock
          uv pip install --python .venv/bin/python --no-deps -e .
          uv pip check --python .venv/bin/python
      - name: Cache pinned public models
        uses: actions/cache@v4
        with:
          path: models
          key: models-qwen3-a06e946b-turbo-749d1c1a-asr-3d3d5dee-v1
      - name: Install pinned local script runtime
        run: |
          mkdir -p work/llama-cpu
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b11729/llama-b11729-bin-ubuntu-x64.tar.gz -o work/llama-cpu.tar.gz
          echo 'ef0db60597825a63534a536bd60d3c290cf82631b2a48461278dc2c9eb436c25  work/llama-cpu.tar.gz' | sha256sum -c -
          tar -xzf work/llama-cpu.tar.gz -C work/llama-cpu
      - name: Download public models
        run: PYTHONPATH=. .venv/bin/python ci/download_models.py
      - name: Generate and review both scripts against your description
        run: .venv/bin/python -m studio.actions_entry --stage write
      - name: Upload generated script for early review
        uses: actions/upload-artifact@v4
        with:
          name: generated-script-${{ github.run_number }}
          retention-days: 7
          path: |
            output/episode/writing/project.json
            output/episode/writing/writer-report.json
            output/episode/writing/scene-plan.json
            output/episode/writing/planned-scenes.json
            output/episode/writing/creative-outline.json
            output/episode/writing/script-review.json
            output/episode/short/writing/*.json
          if-no-files-found: error
      - name: Synthesize character voices and verify spoken words
        run: .venv/bin/python -m studio.actions_entry --stage speech
      - name: Render both formats and review animation and audio
        run: .venv/bin/python -m studio.actions_entry --stage render
      - name: Upload long-form 16:9 video
        uses: actions/upload-artifact@v4
        with:
          name: long-form-${{ github.run_number }}
          retention-days: 7
          path: output/episode/deliverables/long-form/
          if-no-files-found: error
      - name: Upload short-form 9:16 video
        uses: actions/upload-artifact@v4
        with:
          name: short-form-${{ github.run_number }}
          retention-days: 7
          path: output/episode/deliverables/short-form/
          if-no-files-found: error
      - name: Upload generation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generation-diagnostics-${{ github.run_number }}
          retention-days: 7
          path: |
            output/episode/writing/*.json
            output/episode/writing/*.txt
            output/episode/speech/speech-check.json
            output/episode/render/report.json
            output/episode/deliverables/*/quality-review.json
            output/episode/deliverables/*/motion-review.jpg
            output/episode/short/writing/*.json
            output/episode/short/writing/*.txt
            output/episode/short/speech/speech-check.json
            output/episode/short/render/report.json
          if-no-files-found: ignore
